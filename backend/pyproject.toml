[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
    "pillow>=12.1.1",
    "eng-to-ipa>=0.0.2",
]

[dependency-groups]
stt = [
    "faster-whisper>=1.2.1",
]
youtube = [
    # Spec 073 — ingest_pending_youtube worker. Synced only into the dedicated
    # worker venv (uv sync --group youtube --group stt --group production).
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=0.6.2",
]
tts = [
    "edge-tts>=7.0.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
]
production = [
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
]
