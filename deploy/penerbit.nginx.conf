# Penerbit Rumah (Spec 074) — nginx server block.
# Same-origin: serves the built SPA at / and proxies /api/ to the SAME gunicorn
# socket as Hayya Baca, so there is no CORS. Certbot rewrites `listen 80` to SSL.
server {
    server_name penerbit.ihfazh.com;
    client_max_body_size 10m;

    root /home/ihfazh/penerbit-web/dist;
    index index.html;

    # Kompresi: JS/CSS/JSON jauh lebih kecil di jaringan.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://unix:/home/ihfazh/hayyabaca.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Book covers are private: the Django SampulView checks access (or a signed
    # ?t=) then X-Accel-Redirects here. Only nginx-internal requests may hit it.
    location /protected-penerbit-media/ {
        internal;
        alias /home/ihfazh/hayyabaca/backend/media/;
    }

    listen 80;
}
