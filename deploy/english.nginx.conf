# English Practice web — nginx server block.
# Same pattern as ruangcerita.nginx.conf: serves the built SPA at / and
# proxies /api/ + /media/ to the SAME gunicorn socket as Hayya Baca (no CORS).
server {
    server_name english.ihfazh.com;  # sesuaikan
    client_max_body_size 10m;

    root /home/ihfazh/english-web/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://unix:/home/ihfazh/hayyabaca.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # transcribe (faster-whisper) bisa memakan beberapa detik
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Audio segmen lesson (MeloTTS EN-AU mp3) dari MEDIA_ROOT Django
    location /media/ {
        alias /home/ihfazh/hayyabaca/media/;  # sesuaikan dengan MEDIA_ROOT
        expires 7d;
    }

    listen 80;
}
