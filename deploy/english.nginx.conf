# English Practice web — nginx server block.
# Same pattern as ruangcerita.nginx.conf: serves the built SPA at / and
# proxies /api/ + /media/ to the SAME gunicorn socket as Hayya Baca (no CORS).
server {
    server_name english.ihfazh.com;  # sesuaikan
    client_max_body_size 10m;

    root /home/ihfazh/english-web/dist;
    index index.html;

    # Hashed build assets are immutable; the SPA shell must never be cached
    # (else the browser keeps serving a stale index.html → old JS/worker).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    # Self-hosted on-device Whisper model (Spec 065): served to the browser so
    # STT stays offline-first (no HuggingFace CDN). Large, immutable, cache hard.
    location /models/ {
        alias /home/ihfazh/english-web/models/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { application/wasm wasm; application/octet-stream onnx bin; }
        default_type application/octet-stream;
    }

    location /api/ {
        proxy_pass http://unix:/home/ihfazh/hayyabaca.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # transcribe (faster-whisper) bisa memakan beberapa detik
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # English segment audio is access-controlled (Spec 064): the Django
    # SegmentAudioView checks visibility/signature then X-Accel-Redirects here.
    # Only nginx-internal requests may hit it — direct GET returns 404.
    location /protected-english-media/ {
        internal;
        alias /home/ihfazh/hayyabaca/backend/media/;
    }

    # Block direct download of english audio so it can ONLY be served via the
    # protected view above. Other apps' /media/ is unaffected.
    location /media/english/ {
        return 403;
    }

    # Other media (books, games, diary, …) served directly from MEDIA_ROOT.
    location /media/ {
        alias /home/ihfazh/hayyabaca/backend/media/;  # = Django MEDIA_ROOT
        expires 7d;
    }

    listen 80;
}
