# Nadzom (Spec 076) — nginx server block.
# Situs statis murni: tidak ada /api, tidak menyentuh gunicorn Hayya Baca.
# Certbot rewrites `listen 80` to SSL.
server {
    server_name nadzom.ihfazh.com;

    root /home/ihfazh/nadzom-web/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets are immutable; never cache the SPA shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    listen 80;
}
