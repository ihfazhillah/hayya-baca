# Ruang Cerita (Spec 060) — nginx server block.
# Same-origin: serves the built PWA at / and proxies /api/ to the SAME gunicorn
# socket as Hayya Baca, so there is no CORS. Certbot rewrites `listen 80` to SSL.
server {
    server_name ruangcerita.ihfazh.com;
    client_max_body_size 10m;

    root /home/ihfazh/ruangcerita/dist;
    index index.html;

    # SPA fallback — all client routes resolve to the app shell.
    location / {
        try_files $uri /index.html;
    }

    # API + docs → shared Django gunicorn (unix socket).
    location /api/ {
        proxy_pass http://unix:/home/ihfazh/hayyabaca.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Private diary media: only reachable via X-Accel-Redirect from the signed
    # media view — never directly. Requires DIARY_USE_X_ACCEL=1 in backend .env.
    location /protected-media/ {
        internal;
        alias /home/ihfazh/hayyabaca/backend/media/;
    }

    listen 80;
}
