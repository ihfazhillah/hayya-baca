# Tahsin Tracker (Spec 072) — nginx server block.
# Same-origin: serves the built PWA at / and proxies /api/ to the SAME gunicorn
# socket as Hayya Baca, so there is no CORS. Certbot rewrites `listen 80` to SSL.
server {
    server_name tahsin.ihfazh.com;
    client_max_body_size 10m;

    root /home/ihfazh/tahsin-web/dist;
    index index.html;

    # Hashed build assets are immutable; never cache the SPA shell (else the
    # browser keeps serving a stale index.html → old JS/service worker).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    # API → shared Django gunicorn (unix socket). No CORS (same origin).
    location /api/ {
        proxy_pass http://unix:/home/ihfazh/hayyabaca.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 80;
}
